<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Display mic test</title>
<style>
  body { margin: 0; background: #0b0f16; color: #e8edf5; font: 22px/1.4 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 34px; margin: 0 0 12px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; margin: 16px 0; }
  button { font: inherit; font-size: 26px; padding: 18px 28px; border-radius: 14px; border: 0;
           background: #2563eb; color: #fff; min-width: 220px; }
  button:disabled { background: #334155; color: #94a3b8; }
  #meter { height: 48px; background: #1e293b; border-radius: 12px; overflow: hidden; }
  #bar { height: 100%; width: 0; background: linear-gradient(90deg, #22c55e, #eab308, #ef4444); transition: width 60ms; }
  pre { background: #111827; padding: 16px; border-radius: 12px; white-space: pre-wrap; font-size: 18px;
        max-height: 46vh; overflow: auto; }
  .ok { color: #4ade80; } .bad { color: #f87171; } .warn { color: #facc15; }
</style>
</head>
<body>
<main>
  <h1>Connect Display microphone test</h1>
  <div id="summary">Running checks…</div>
  <div class="row">
    <button id="start">1. Start mic</button>
    <button id="record" disabled>2. Record 5 s</button>
    <button id="play" disabled>3. Play back</button>
    <button id="tone">Speaker tone</button>
  </div>
  <div id="meter"><div id="bar"></div></div>
  <p id="level">Level: –</p>
  <pre id="log"></pre>
</main>
<script>
const $ = (id) => document.getElementById(id);
const log = (msg, cls) => {
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = `${new Date().toLocaleTimeString()}  ${msg}`;
  $('log').appendChild(line);
  $('log').scrollTop = $('log').scrollHeight;
};
let stream, recorder, chunks = [], blobUrl, audioCtx;

async function listDevices(tag) {
  if (!navigator.mediaDevices?.enumerateDevices) { log('enumerateDevices unavailable', 'bad'); return []; }
  const devs = await navigator.mediaDevices.enumerateDevices();
  log(`${tag}: ${devs.length} device(s)`);
  devs.forEach((d) => log(`  ${d.kind}  "${d.label || '(no label until permission)'}"  ${d.deviceId.slice(0, 10)}`));
  return devs;
}

async function checks() {
  log(`UA: ${navigator.userAgent}`);
  log(`secure context: ${window.isSecureContext}`, window.isSecureContext ? 'ok' : 'bad');
  log(`mediaDevices: ${!!navigator.mediaDevices}`, navigator.mediaDevices ? 'ok' : 'bad');
  log(`MediaRecorder: ${typeof MediaRecorder !== 'undefined'}`);
  try {
    const p = await navigator.permissions.query({ name: 'microphone' });
    log(`mic permission: ${p.state}`, p.state === 'denied' ? 'bad' : '');
    p.onchange = () => log(`mic permission changed: ${p.state}`);
  } catch (e) { log(`permissions.query failed: ${e}`, 'warn'); }
  const devs = await listDevices('before permission');
  const inputs = devs.filter((d) => d.kind === 'audioinput').length;
  $('summary').innerHTML = `Audio inputs seen: <b class="${inputs ? 'ok' : 'bad'}">${inputs}</b>. Tap “Start mic”.`;
}

$('start').onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
    const track = stream.getAudioTracks()[0];
    log(`getUserMedia OK: "${track.label}"`, 'ok');
    log(`settings: ${JSON.stringify(track.getSettings())}`);
    $('summary').innerHTML = `<b class="ok">Mic working:</b> ${track.label || 'unnamed input'}. Speak and watch the meter.`;
    await listDevices('after permission');
    audioCtx = new AudioContext();
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    audioCtx.createMediaStreamSource(stream).connect(analyser);
    const buf = new Float32Array(analyser.fftSize);
    let peak = -Infinity;
    const tick = () => {
      analyser.getFloatTimeDomainData(buf);
      const rms = Math.sqrt(buf.reduce((s, v) => s + v * v, 0) / buf.length);
      const db = 20 * Math.log10(rms || 1e-8);
      peak = Math.max(peak, db);
      $('bar').style.width = `${Math.min(100, Math.max(0, (db + 70) * 1.6))}%`;
      $('level').textContent = `Level: ${db.toFixed(1)} dBFS   (peak ${peak.toFixed(1)})`;
      requestAnimationFrame(tick);
    };
    tick();
    $('start').disabled = true;
    $('record').disabled = typeof MediaRecorder === 'undefined';
  } catch (e) {
    log(`getUserMedia FAILED: ${e.name}: ${e.message}`, 'bad');
    $('summary').innerHTML = `<b class="bad">Mic failed:</b> ${e.name}`;
  }
};

$('record').onclick = () => {
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = (e) => chunks.push(e.data);
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: recorder.mimeType });
    if (blobUrl) URL.revokeObjectURL(blobUrl);
    blobUrl = URL.createObjectURL(blob);
    log(`recorded ${blob.size} bytes (${recorder.mimeType})`, blob.size ? 'ok' : 'bad');
    $('play').disabled = false;
    $('record').disabled = false;
    $('record').textContent = '2. Record 5 s';
  };
  recorder.start();
  $('record').disabled = true;
  $('record').textContent = 'Recording…';
  setTimeout(() => recorder.stop(), 5000);
};

$('play').onclick = () => {
  const a = new Audio(blobUrl);
  a.play().then(() => log('playing back')).catch((e) => log(`playback failed: ${e}`, 'bad'));
};

$('tone').onclick = () => {
  const ctx = audioCtx || new AudioContext();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  gain.gain.value = 0.2;
  osc.frequency.value = 440;
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 1);
  log('speaker: 1 s 440 Hz tone');
};

checks();
</script>
</body>
</html>
